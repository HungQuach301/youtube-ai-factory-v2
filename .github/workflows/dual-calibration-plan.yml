name: dual-calibration-plan

run-name: G-02G dual calibration plan · ${{ github.sha }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dual-calibration-plan.yml
      - qualification-runs/dual-calibration-plan.json
      - scripts/build-dual-calibration-plan.mjs
      - packages/aligner-calibration/**
      - packages/human-evidence/**
  push:
    branches:
      - g-02g-dual-calibration
    paths:
      - .github/workflows/dual-calibration-plan.yml
      - qualification-runs/dual-calibration-plan.json
      - scripts/build-dual-calibration-plan.mjs
      - packages/aligner-calibration/**
      - packages/human-evidence/**

permissions:
  contents: read

concurrency:
  group: g-02g-dual-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIRST_OUTPUT_DIR: dual-calibration-plan-output
      REPLAY_OUTPUT_DIR: dual-calibration-plan-replay
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Repository identity
        run: pnpm verify:repo

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Source integrity
        run: pnpm verify:source

      - name: Build typed calibration boundaries
        run: pnpm build

      - name: Test dual calibration guardrails
        run: >-
          pnpm vitest run
          packages/aligner-calibration/tests/dual-calibration.test.ts
          packages/human-evidence/tests/dual-calibration-plan.test.ts
          packages/human-evidence/tests/qualification-intake.test.ts

      - name: Materialize owner-action-required plan
        run: node scripts/build-dual-calibration-plan.mjs --output "$FIRST_OUTPUT_DIR"

      - name: Replay from the same pinned marker
        run: node scripts/build-dual-calibration-plan.mjs --output "$REPLAY_OUTPUT_DIR"

      - name: Verify byte-for-byte idempotent replay
        run: node scripts/build-dual-calibration-plan.mjs --verify-replay "$FIRST_OUTPUT_DIR" "$REPLAY_OUTPUT_DIR"

      - name: Seal artifact read-back evidence
        shell: bash
        run: |
          (
            cd "$FIRST_OUTPUT_DIR"
            find . -type f ! -name artifact-sha256s.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > artifact-sha256s.txt
            sha256sum --check artifact-sha256s.txt
          )

      - name: Upload qualification-only plan
        uses: actions/upload-artifact@v4
        with:
          name: dual-calibration-plan-g-02g-${{ github.run_id }}
          path: dual-calibration-plan-output/
          if-no-files-found: error
          retention-days: 14
