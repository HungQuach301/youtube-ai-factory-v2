name: media-worker-image
run-name: Media worker image · PR #${{ github.event.pull_request.number }} · ${{ github.sha }}

on:
  pull_request:
    paths:
      - "packages/media-worker/**"
      - "packages/contracts/**"
      - "packages/core-hash/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/media-worker-image.yml"

permissions:
  contents: read

concurrency:
  group: media-worker-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Fly Dockerfile path
        run: |
          config_dir="packages/media-worker"
          dockerfile="$(awk -F'"' '/^[[:space:]]*dockerfile[[:space:]]*=/ { print $2; exit }' "${config_dir}/fly.toml")"
          test -n "$dockerfile"
          test -f "${config_dir}/${dockerfile}"
      - name: Require immutable base image
        run: grep -Eq '^FROM .+@sha256:[a-f0-9]{64}' packages/media-worker/Dockerfile
      - name: Build worker image
        run: docker build --file packages/media-worker/Dockerfile --tag factory-media-worker:test .
      - name: Verify Stage 10 Python runtime as non-root
        run: |
          docker run --rm --entrypoint sh factory-media-worker:test -c \
            'test "$(id -u)" -ne 0 && python3 /app/scripts/verify-stage10-python-runtime.py --output /tmp/stage10-python.json'
      - name: Verify Stage 12 corrected pre-master smoke
        run: docker run --rm --entrypoint node factory-media-worker:test stage12-remediation-smoke.mjs
      - name: Verify Stage 12 encoded-loudness diagnostic replay smoke
        run: docker run --rm --entrypoint node factory-media-worker:test stage12-diagnostic-replay-smoke.mjs
      - name: Verify Stage 12 codec-safe true-peak shadow smoke
        run: docker run --rm --entrypoint node factory-media-worker:test stage12-codec-safe-true-peak-shadow-smoke.mjs
      - name: Verify Stage 12 codec-safe LRA guard shadow smoke
        run: docker run --rm --entrypoint node factory-media-worker:test stage12-codec-safe-lra-guard-shadow-smoke.mjs
      - name: Verify Stage 12 LRA feasibility real-FFmpeg zero-upload smoke
        run: docker run --rm --entrypoint node factory-media-worker:test stage12-lra-feasibility-zero-upload-smoke.mjs
      - name: Prove health and absence of D1 binding
        run: |
          docker run --detach --name factory-media-worker \
            --env MEDIA_IMAGE_DIGEST=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env MEDIA_STAGE12_ENABLED=true \
            --env MEDIA_STAGE10_VERIFY_KEY=ci-stage12-signing-boundary \
            --publish 18080:8080 factory-media-worker:test
          for attempt in $(seq 1 20); do
            health="$(curl --fail --silent http://127.0.0.1:18080/health || true)"
            if echo "$health" | jq --exit-status \
              '.ok == true and .jobDispatchEnabled == false and .pythonRuntimeVerified == true
               and .stage12Ready == true and .encodedLoudnessDiagnosticReplayReady == true
               and .codecSafeTruePeakShadowReady == true
               and .codecSafeLraGuardShadowReady == true
               and .imageDigest == "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs factory-media-worker
          exit 1
      - name: Prove live job dispatch is fail-closed by default
        run: |
          status="$(curl --silent --output /tmp/media-job-response.json --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            http://127.0.0.1:18080/jobs)"
          test "$status" = "503"
          jq --exit-status '.ok == false and .code == "JOB_DISPATCH_DISABLED"' \
            /tmp/media-job-response.json >/dev/null
      - name: Negative D1 capability check
        run: |
          if docker inspect factory-media-worker --format '{{json .Config.Env}}' | grep -Eq '(^|[^A-Z])D1([^A-Z]|$)'; then
            echo 'D1 binding detected in media worker image' >&2
            exit 1
          fi
      - name: Clean up test container
        if: always()
        run: docker rm --force factory-media-worker >/dev/null 2>&1 || true
