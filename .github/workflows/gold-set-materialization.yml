name: gold-set-materialization

run-name: G-02E synthetic gold set · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - g-02e-gold-set-materialization
    paths:
      - .github/workflows/gold-set-materialization.yml
      - qualification-runs/gold-set.json
      - scripts/materialize-synthetic-gold-set.mjs
      - packages/gold-set/**

permissions:
  contents: read

concurrency:
  group: g-02e-gold-set-materialization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FIRST_OUTPUT_DIR: gold-set-materialization-output
      REPLAY_OUTPUT_DIR: gold-set-materialization-replay
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Repository identity
        run: pnpm verify:repo

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Source integrity
        run: pnpm verify:source

      - name: Build deterministic boundaries
        run: pnpm build

      - name: Install materialization tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg fonts-dejavu-core
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Materialize qualification samples
        run: node scripts/materialize-synthetic-gold-set.mjs --output "$FIRST_OUTPUT_DIR"

      - name: Replay materialization from the same pinned input
        run: node scripts/materialize-synthetic-gold-set.mjs --output "$REPLAY_OUTPUT_DIR"

      - name: Verify byte-for-byte idempotent replay
        run: node scripts/materialize-synthetic-gold-set.mjs --verify-replay "$FIRST_OUTPUT_DIR" "$REPLAY_OUTPUT_DIR"

      - name: Seal read-back evidence
        shell: bash
        run: |
          {
            node --version
            pnpm --version
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          } > "$FIRST_OUTPUT_DIR/toolchain.txt"
          find "$FIRST_OUTPUT_DIR" -type f ! -name artifact-sha256s.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$FIRST_OUTPUT_DIR/artifact-sha256s.txt"
          sha256sum --check "$FIRST_OUTPUT_DIR/artifact-sha256s.txt"

      - name: Upload qualification-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-set-g-02e-${{ github.run_id }}
          path: gold-set-materialization-output/
          if-no-files-found: error
          retention-days: 14
