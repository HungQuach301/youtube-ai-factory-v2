name: Fly media-worker Production
run-name: Fly media-worker Production · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/media-worker/**"
      - "packages/contracts/**"
      - "packages/core-hash/**"
      - "scripts/whisperx-phoneme-observer.py"
      - "scripts/replay-semantic-normalization.py"
      - "scripts/verify-stage10-python-runtime.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-media-worker.yml"

permissions:
  contents: read

concurrency:
  group: fly-media-worker-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable source and deployment credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -n "${FLY_API_TOKEN}"

      - name: Build production candidate
        run: docker build --file packages/media-worker/Dockerfile --tag factory-media-worker:production-candidate .

      - name: Verify Stage 12 runtime and font in candidate
        run: |
          docker run --detach --name factory-media-worker-candidate \
            --env MEDIA_IMAGE_DIGEST=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env MEDIA_STAGE12_ENABLED=true \
            --env MEDIA_STAGE10_VERIFY_KEY=ci-stage12-readiness-key \
            --publish 18080:8080 factory-media-worker:production-candidate
          for attempt in $(seq 1 30); do
            health="$(curl --fail --silent --connect-timeout 1 --max-time 3 http://127.0.0.1:18080/health || true)"
            if echo "${health}" | jq --exit-status \
              '.ok == true and .stage12Ready == true and .stage12FontVerified == true and .pythonRuntimeVerified == true' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs factory-media-worker-candidate
          exit 1

      - name: Verify Stage 12 renderer smoke in candidate
        run: docker exec factory-media-worker-candidate node stage12-render-smoke.mjs

      - name: Verify Stage 12 encoded loudness smoke in candidate
        run: docker exec factory-media-worker-candidate node stage12-audio-smoke.mjs

      - name: Verify Stage 12 corrected pre-master smoke in candidate
        run: docker exec factory-media-worker-candidate node stage12-remediation-smoke.mjs

      - name: Clean up candidate
        if: always()
        run: docker rm --force factory-media-worker-candidate >/dev/null 2>&1 || true

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Capture redacted pre-deploy Fly diagnostics
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app youtube-ai-factory-v2-media-worker-prod || true
          flyctl machine list --app youtube-ai-factory-v2-media-worker-prod --json \
            | jq '[.[] | {id, state, region, image_ref, created_at, updated_at}]' || true
          flyctl logs --app youtube-ai-factory-v2-media-worker-prod --no-tail 2>/dev/null \
            | grep -Eo 'MEDIA_IMAGE_DIGEST must be the immutable digest of the running image|ERR_MODULE_NOT_FOUND|Cannot find module|EACCES|EADDRINUSE|JavaScript heap out of memory|Killed|OOM|Out of memory' \
            | sort -u || true
      - name: Build and push exact main image
        id: production_image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          image_label="commit-${GITHUB_SHA}"
          build_log="$(mktemp)"
          flyctl deploy . \
            --config packages/media-worker/fly.toml \
            --dockerfile packages/media-worker/Dockerfile \
            --remote-only --build-only --push \
            --image-label "${image_label}" 2>&1 | tee "${build_log}"
          image_digest="$(sed -nE 's/.*pushing manifest for [^@]+@(sha256:[a-f0-9]{64}).*/\1/p' "${build_log}" | tail -1)"
          test "${image_digest}" != ""
          echo "${image_digest}" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "digest=${image_digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=registry.fly.io/youtube-ai-factory-v2-media-worker-prod@${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy exact main image and matching provenance digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy . \
            --config packages/media-worker/fly.toml \
            --image "${{ steps.production_image.outputs.reference }}" \
            --env "MEDIA_IMAGE_DIGEST=${{ steps.production_image.outputs.digest }}" \
            --detach

      - name: Verify Fly Production health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for attempt in $(seq 1 36); do
            health="$(curl --fail --silent --connect-timeout 3 --max-time 8 https://youtube-ai-factory-v2-media-worker-prod.fly.dev/health || true)"
            if echo "${health}" | jq --exit-status \
              '.ok == true and .stage12Ready == true and .stage12FontVerified == true and .pythonRuntimeVerified == true and .jobDispatchEnabled == false' >/dev/null; then
              echo "${health}" | jq '{ok, stage12Ready, stage12FontVerified, pythonRuntimeVerified, jobDispatchEnabled, imageDigest}'
              exit 0
            fi
            sleep 10
          done
          flyctl status --app youtube-ai-factory-v2-media-worker-prod || true
          flyctl machine list --app youtube-ai-factory-v2-media-worker-prod --json \
            | jq '[.[] | {id, state, region, image_ref, created_at, updated_at}]' || true
          flyctl logs --app youtube-ai-factory-v2-media-worker-prod --no-tail 2>/dev/null \
            | grep -Eo 'MEDIA_IMAGE_DIGEST must be the immutable digest of the running image|ERR_MODULE_NOT_FOUND|Cannot find module|EACCES|EADDRINUSE|JavaScript heap out of memory|Killed|OOM|Out of memory' \
            | sort -u || true
          exit 1
