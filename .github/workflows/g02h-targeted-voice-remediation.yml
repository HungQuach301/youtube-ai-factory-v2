name: g02h-targeted-voice-remediation

run-name: G-02H-B one-sample voice remediation · ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g02h-targeted-voice-remediation.yml
      - qualification-runs/g02h-targeted-voice-remediation.json
      - scripts/run-targeted-voice-remediation.py
      - scripts/replay-semantic-normalization.py
      - scripts/whisperx-phoneme-observer.py
      - tests/guardrails/g16-targeted-voice-remediation.test.mjs

permissions:
  actions: read
  contents: read

concurrency:
  group: g-02h-b-targeted-voice-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      G02GB_SOURCE_DIR: source-g02gb
      G02HA_SOURCE_DIR: source-g02ha
      FIRST_OUTPUT_DIR: g02h-targeted-remediation-output
      REPLAY_OUTPUT_DIR: g02h-targeted-remediation-replay
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repository identity
        run: pnpm verify:repo

      - name: Install locked repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Source integrity
        run: pnpm verify:source

      - name: Build typed boundaries
        run: pnpm build

      - name: Test targeted remediation guardrail
        run: pnpm vitest run tests/guardrails/g16-targeted-voice-remediation.test.mjs

      - name: Download sealed G-02G-B evidence
        uses: actions/download-artifact@v4
        with:
          name: dual-calibration-live-g-02g-b-33230810559
          path: source-g02gb
          github-token: ${{ github.token }}
          repository: HungQuach301/youtube-ai-factory-v2
          run-id: 33230810559

      - name: Download sealed G-02H-A evidence
        uses: actions/download-artifact@v4
        with:
          name: g02h-semantic-normalization-replay-33238636625
          path: source-g02ha
          github-token: ${{ github.token }}
          repository: HungQuach301/youtube-ai-factory-v2
          run-id: 33238636625

      - name: Install pinned audio observation tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install whisperx==3.4.2 g2p-en==2.1.0 nltk==3.9.1 inflect==7.5.0
          python -m nltk.downloader -q averaged_perceptron_tagger averaged_perceptron_tagger_eng cmudict

      - name: Run one-call targeted qualification remediation
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: >-
          python scripts/run-targeted-voice-remediation.py
          --config qualification-runs/g02h-targeted-voice-remediation.json
          --g02gb-source "$G02GB_SOURCE_DIR"
          --g02ha-source "$G02HA_SOURCE_DIR"
          --output "$FIRST_OUTPUT_DIR"

      - name: Replay with provider credential absent
        run: >-
          env -u ELEVENLABS_API_KEY
          python scripts/run-targeted-voice-remediation.py
          --replay-from "$FIRST_OUTPUT_DIR"
          --output "$REPLAY_OUTPUT_DIR"

      - name: Verify idempotent replay
        run: >-
          python scripts/run-targeted-voice-remediation.py
          --verify "$FIRST_OUTPUT_DIR" "$REPLAY_OUTPUT_DIR"

      - name: Seal portable artifact checksums
        if: always()
        shell: bash
        run: |
          if [[ -d "$FIRST_OUTPUT_DIR" ]]; then
            (
              cd "$FIRST_OUTPUT_DIR"
              find . -type f ! -name artifact-sha256s.txt -print0 \
                | sort -z \
                | xargs -0 sha256sum > artifact-sha256s.txt
              sha256sum --check artifact-sha256s.txt
            )
          fi

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02h-targeted-voice-remediation-${{ github.run_id }}
          path: g02h-targeted-remediation-output/
          if-no-files-found: error
          retention-days: 14
