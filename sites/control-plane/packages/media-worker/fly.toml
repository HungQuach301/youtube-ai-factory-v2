app = "youtube-ai-factory-v2-media-worker-prod"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory = "4096mb"

[env]
  MEDIA_GPU = "false"
  MEDIA_WORKER_MODE = "queue"
  MEDIA_JOB_DISPATCH_ENABLED = "false"
  MEDIA_STAGE10_ENABLED = "true"
  MEDIA_STAGE10_VERIFY_KEY = "MCowBQYDK2VwAyEArYGfR2yAFXqTXBUFzwf5Eyod9MfoE405MZUQ2qAULL8="
  MEDIA_STAGE12_ENABLED = "true"
